name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build
      # The smoke suite runs vitest directly against the build step above; the
      # test:routes script wraps the same vitest run in its own build, which
      # would build a second time.
      - name: Run route smoke tests
        run: npx vitest run --config tests/smoke/vitest.config.mts
