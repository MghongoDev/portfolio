name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Run route smoke tests
        # Calls the same script the local flow does, so the smoke vitest
        # invocation has one home. test:routes wraps it in its own build,
        # which would build a second time on top of the step above.
        run: npm run test:smoke
      - name: Run hero type-scale guard
        # Measures the real rendered hero through headless Chrome, so the
        # editorial type scale is gated rather than merely present. The guard
        # starts neither Chrome nor the server; this step does, and tears both
        # down whatever the verdict is.
        #
        # Both services are checked for readiness before the guard runs, and a
        # service that never comes up fails the step. The guard polls on its
        # own too, but failing here names the cause instead of surfacing as a
        # hero that never rendered.
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-port=9222 --remote-allow-origins='*' \
            about:blank > /tmp/chrome.log 2>&1 &
          CHROME_PID=$!
          chrome_ready=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9222/json/version > /dev/null; then
              chrome_ready=1; break
            fi
            sleep 0.5
          done
          npx next start -p 3311 > /tmp/next.log 2>&1 &
          NEXT_PID=$!
          server_ready=0
          for _ in $(seq 1 120); do
            if curl -sf http://127.0.0.1:3311/ > /dev/null; then
              server_ready=1; break
            fi
            sleep 0.5
          done
          if [ "$chrome_ready" != "1" ]; then
            echo "Chrome DevTools endpoint never came up; last log lines:"
            tail -20 /tmp/chrome.log
            kill "$NEXT_PID" "$CHROME_PID" 2>/dev/null || true
            exit 1
          fi
          if [ "$server_ready" != "1" ]; then
            echo "Next server never came up; last log lines:"
            tail -20 /tmp/next.log
            kill "$NEXT_PID" "$CHROME_PID" 2>/dev/null || true
            exit 1
          fi
          node scripts/check-hero-scale.mjs http://127.0.0.1:3311/ --cdp http://127.0.0.1:9222
          STATUS=$?
          kill "$NEXT_PID" "$CHROME_PID" 2>/dev/null || true
          exit $STATUS
      - name: Run hero chart guard
        # Measures the real rendered hero through headless Chrome, so the
        # chart recede is gated rather than merely present. Starts its own
        # Chrome instance and Next server so it does not depend on the
        # previous guard step's processes, which are not shared across
        # GitHub Actions steps.
      - name: Run hero grain guard
        # Measures the grain layer on the hero through headless Chrome, so
        # the texture is gated rather than merely present. The guard
        # inherits the same Chrome + server teardown pattern as the scale
        # guard above.
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-port=9222 --remote-allow-origins='*' \
            about:blank > /tmp/chrome.log 2>&1 &
          CHROME_PID=$!
          chrome_ready=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9222/json/version > /dev/null; then
              chrome_ready=1; break
            fi
            sleep 0.5
          done
          npx next start -p 3311 > /tmp/next.log 2>&1 &
          NEXT_PID=$!
          server_ready=0
          for _ in $(seq 1 120); do
            if curl -sf http://127.0.0.1:3311/ > /dev/null; then
              server_ready=1; break
            fi
            sleep 0.5
          done
          if [ "$chrome_ready" != "1" ]; then
            echo "Chrome DevTools endpoint never came up; last log lines:"
            tail -20 /tmp/chrome.log
            kill "$NEXT_PID" "$CHROME_PID" 2>/dev/null || true
            exit 1
          fi
          if [ "$server_ready" != "1" ]; then
            echo "Next server never came up; last log lines:"
            tail -20 /tmp/next.log
            kill "$NEXT_PID" "$CHROME_PID" 2>/dev/null || true
            exit 1
          fi
          node scripts/check-hero-chart.mjs http://127.0.0.1:3311/ --cdp http://127.0.0.1:9222
          STATUS=$?
          kill "$NEXT_PID" "$CHROME_PID" 2>/dev/null || true
          exit $STATUS
      - name: Run hero grain guard
        # Measures the grain layer on the hero through headless Chrome, so
        # the texture is gated rather than merely present. The guard
        # inherits the same Chrome + server teardown pattern as the scale
        # guard above.
          node scripts/check-hero-grain.mjs http://127.0.0.1:3311/ --cdp http://127.0.0.1:9222
          STATUS=$?
          kill "$NEXT_PID" "$CHROME_PID" 2>/dev/null || true
          exit $STATUS
      - name: Run hero chart guard
        # Measures the real rendered hero through headless Chrome, so the
        # chart recede is gated rather than merely present. Starts its own
        # Chrome instance and Next server so it does not depend on the
        # previous guard step's processes, which are not shared across
        # GitHub Actions steps.
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-port=9222 --remote-allow-origins='*' \
            about:blank > /tmp/chrome.log 2>&1 &
          CHROME_PID=$!
          chrome_ready=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9222/json/version > /dev/null; then
              chrome_ready=1; break
            fi
            sleep 0.5
          done
          npx next start -p 3311 > /tmp/next.log 2>&1 &
          NEXT_PID=$!
          server_ready=0
          for _ in $(seq 1 120); do
            if curl -sf http://127.0.0.1:3311/ > /dev/null; then
              server_ready=1; break
            fi
            sleep 0.5
          done
          if [ "$chrome_ready" != "1" ]; then
            echo "Chrome DevTools endpoint never came up; last log lines:"
            tail -20 /tmp/chrome.log
            kill "$NEXT_PID" "$CHROME_PID" 2>/dev/null || true
            exit 1
          fi
          if [ "$server_ready" != "1" ]; then
            echo "Next server never came up; last log lines:"
            tail -20 /tmp/next.log
            kill "$NEXT_PID" "$CHROME_PID" 2>/dev/null || true
            exit 1
          fi
          node scripts/check-hero-grain.mjs http://127.0.0.1:3311/ --cdp http://127.0.0.1:9222
          node scripts/check-hero-chart.mjs http://127.0.0.1:3311/ --cdp http://127.0.0.1:9222
          STATUS=$?
          kill "$NEXT_PID" "$CHROME_PID" 2>/dev/null || true
          exit $STATUS
