name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Run route smoke tests
        # Calls the same script the local flow does, so the smoke vitest
        # invocation has one home. test:routes wraps it in its own build,
        # which would build a second time on top of the step above.
        run: npm run test:smoke
      # Each hero guard is a one-liner. scripts/hero-harness.mjs starts Chrome
      # and the production server on ports it is given, waits for both, runs
      # the guard, and tears both down whatever the verdict is, so the three
      # steps cannot drift apart the way three hand-rolled copies did. A
      # service that never comes up fails the step and names itself, rather
      # than surfacing as a hero that never rendered.
      - name: Run hero type-scale guard
        run: node scripts/hero-harness.mjs scripts/check-hero-scale.mjs
      - name: Run hero grain guard
        run: node scripts/hero-harness.mjs scripts/check-hero-grain.mjs
      - name: Run hero chart guard
        run: node scripts/hero-harness.mjs scripts/check-hero-chart.mjs
