name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Run route smoke tests
        # Calls the same script the local flow does, so the smoke vitest
        # invocation has one home. test:routes wraps it in its own build,
        # which would build a second time on top of the step above.
        run: npm run test:smoke
